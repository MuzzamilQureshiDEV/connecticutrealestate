# Builds a static export of the site and publishes it to GitHub Pages.
# Live URL: https://muzzamilqureshidev.github.io/connecticutrealestate/
#
# Pages serves static files only, so the build runs with NEXT_EXPORT=1
# (output: 'export') and NEXT_BASE_PATH so every asset resolves under the
# /connecticutrealestate/ sub-path. `configure-pages` switches the Pages source
# to "GitHub Actions" — serving from a branch would publish the repo source
# instead of the build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on and points it at this workflow.
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_EXPORT: '1'
          NEXT_BASE_PATH: /connecticutrealestate

      # Next emits assets under _next/. Jekyll ignores underscore-prefixed
      # directories, so this guards against the site loading unstyled if the
      # artifact is ever served through the legacy Jekyll path.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
