# Builds a static export of the site and publishes it to GitHub Pages.
# Live URL: https://muzzamilqureshidev.github.io/connecticutrealestate/
#
# WHY THE gh-pages BRANCH RATHER THAN THE OFFICIAL PAGES PIPELINE:
# `actions/configure-pages` with `enablement: true` has to create the Pages
# site when one does not exist yet, and the workflow token is not permitted to
# do that on this repo — the step failed and skipped the whole build. Pushing a
# gh-pages branch enables Pages automatically and needs no repo settings
# change, so that is the route used here.
#
# Pages serves static files only, so the build runs with NEXT_EXPORT=1
# (output: 'export') and NEXT_BASE_PATH so every asset resolves under the
# /connecticutrealestate/ sub-path.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_EXPORT: '1'
          NEXT_BASE_PATH: /connecticutrealestate

      # Next emits assets under _next/. Jekyll skips underscore-prefixed
      # directories, so without this the site would load completely unstyled.
      - run: touch out/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
